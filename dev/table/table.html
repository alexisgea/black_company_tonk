<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tonk dev table</title>
    <link rel="stylesheet" href="/table.css" />
  </head>
  <body>
    <header>
      <h1>Tonk dev table</h1>
      <span id="status"></span>
      <button id="next" type="button" autofocus>Next</button>
      <span class="hint">Space or Enter does the same</span>
    </header>
    <details id="settings">
      <summary>New table</summary>
      <form id="new-table">
        <div id="roster"></div>
        <label>Seed <input id="seed" type="number" step="1" placeholder="random" /></label>
        <label>Coins <input id="coins" type="number" min="1" step="1" value="50" /></label>
        <label>Bet <input id="bet" type="number" min="1" step="1" value="5" /></label>
        <button type="submit">Start a new table</button>
        <span id="form-error" class="error"></span>
      </form>
    </details>
    <main>
      <section id="players"></section>
      <section id="board"></section>
      <section id="log"></section>
    </main>
    <script src="/table.js"></script>
  </body>
</html>
